stages:
  - build
  - test
  - sast
  - scan
  - push
  - deploy

variables:
  IMAGE: registry.gitlab.com/<user>/application:$CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: node:18-alpine
  script:
    - npm install

test:
  stage: test
  image: node:18-alpine
  script:
    - npm test

sast:
  stage: sast
  image: sonarsource/sonar-scanner-cli
  script:
    - sonar-scanner -Dsonar.projectKey=application -Dsonar.host.url=$SONAR_HOST -Dsonar.login=$SONAR_TOKEN

docker-build:
  stage: build
  image: docker:24
  services: [docker:24-dind]
  script:
    - docker build -t $IMAGE .
    - docker save $IMAGE -o image.tar
  artifacts:
    paths: [image.tar]

trivy-scan:
  stage: scan
  image: aquasec/trivy:latest
  script:
    - trivy image --input image.tar --exit-code 1 --severity CRITICAL,HIGH

push:
  stage: push
  image: docker:24
  services: [docker:24-dind]
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - docker load -i image.tar
    - docker push $IMAGE

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl set image deployment/application application=$IMAGE -n devsecops --kubeconfig $KUBE_CONFIG
  only:
    - main
